name: Macro dashboard data

# Runs the live pipeline where the internet is open (GitHub's runners), then
# commits the exported history CSVs and the latest snapshot back to the branch
# so any environment can `python -m macrodash import` real data.
on:
  schedule:
    # Target: 05:30 UK on weekdays. GitHub often starts scheduled runs late
    # (hours late at busy times) and occasionally drops them, so there are
    # several slots until 08:30 UK. The gate lets the first one
    # at or after 05:30 UK through and skips the rest once today's data is in.
    # Minutes avoid :00/:30, when GitHub's scheduler is most congested; the
    # UK (05:13) and Fed (05:18) dashboards go first as they share the
    # Refinitiv account.
    - cron: '3,33 4-7 * * 1-5'
  push:
    branches: ['main']
    paths: ['backend/**', 'config/**', 'web/**', '.github/workflows/daily-data.yml']
  workflow_dispatch:

concurrency:
  group: macro-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Gate on 05:30 UK
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(TZ=Europe/London date +%H%M); dow=$(TZ=Europe/London date +%u)
          if [ "$dow" -gt 5 ] || [ "$now" -lt 0530 ] || [ "$now" -ge 0830 ]; then
            echo "Outside the 05:30-08:30 UK weekday window ($now)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Already refreshed today (a data commit since 05:00 UK)? Then skip.
          since=$(date -u -d "@$(TZ=Europe/London date -d 'today 05:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          refreshed=$(gh api "repos/${{ github.repository }}/commits?sha=${{ github.ref_name }}&since=${since}&per_page=50" \
                 --jq '[.[] | select(.commit.message | startswith("macro data:"))] | length')
          if [ "${refreshed:-0}" -gt 0 ]; then
            echo "Today's refresh already done."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          # The branch tip, not the triggering commit, so a run that starts
          # right after another run's data commit builds on it.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements-dev.txt

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: python -m pytest -q

      - name: Fetch, compute, export
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        env:
          MACRO_HTTP_RETRIES: '2'
          # Refinitiv allows one session per account. Wait up to 10 minutes for
          # another job (fed / UK dashboards run at 05:15 and 05:20) to sign out.
          MACRO_REFINITIV_SESSION_RETRIES: '10'
          MACRO_REFINITIV_SESSION_WAIT: '60'
          # Repository variable: set to true to sign out a Workspace session
          # left open overnight (Settings -> Secrets and variables -> Variables).
          MACRO_REFINITIV_TAKE_SESSION: ${{ vars.MACRO_REFINITIV_TAKE_SESSION || 'false' }}
          # Runs started by a code push can happen during the working day; they
          # use the free sources only and never touch the Refinitiv session.
          MACRO_REFINITIV_DISABLED: ${{ github.event_name == 'push' && '1' || '' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFINITIV_APP_KEY: ${{ secrets.REFINITIV_APP_KEY }}
          REFINITIV_USERNAME: ${{ secrets.REFINITIV_USERNAME }}
          REFINITIV_PASSWORD: ${{ secrets.REFINITIV_PASSWORD }}
          REFINITIV_CLIENT_ID: ${{ secrets.REFINITIV_CLIENT_ID }}
          REFINITIV_CLIENT_SECRET: ${{ secrets.REFINITIV_CLIENT_SECRET }}
        run: |
          mkdir -p ../data/export
          python -m macrodash import || true
          # The probe is diagnostic only: bounded, and visible in the log.
          # Probe without Refinitiv so the account's single session is kept for the real run.
          MACRO_REFINITIV_DISABLED=1 timeout 600 python -m macrodash sources 2>&1 | tee ../data/export/sources-report.txt || true
          python -m macrodash run
          python -m macrodash export

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git add data/export
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(python -c "import json;print(json.load(open('data/export/dashboard.json'))['meta']['as_of'])")
          git commit -m "macro data: refresh through ${AS_OF}"
          # If another run committed data meanwhile, keep this run's (newer) files.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not push the data commit"; exit 1

      # Publish the website: every number and chart series is exported as a
      # file, so GitHub Pages can host it without a running server.
      - name: Export site data
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: python -m macrodash export-static --out ../web/public/data

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        if: steps.gate.outputs.run == 'true'
        env:
          VITE_STATIC: '1'
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
